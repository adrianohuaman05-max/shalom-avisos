name: Revisar pedidos Shalom

on:
  schedule:
    # Cada 30 minutos. GitHub usa UTC. Corre solo, sin tu laptop.
    - cron: "*/30 * * * *"
  workflow_dispatch:      # permite ejecutarlo a mano desde la web de GitHub
    inputs:
      sin_avisos:
        description: "Solo sincronizar estados, sin avisar a nadie (util la primera vez)"
        type: boolean
        default: false
      probar_ticket:
        description: "N de pedido para probar el envio del ticket (deja vacio para una corrida normal)"
        type: string
        default: ""
      reavisar:
        description: "Reenviar el aviso de llegada de estos pedidos, separados por coma"
        type: string
        default: ""

permissions:
  contents: write          # para guardar orders.json / state.json

concurrency:
  group: revisar-shalom
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar revision
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHALOM_EMAIL: ${{ secrets.SHALOM_EMAIL }}
          SHALOM_PASSWORD: ${{ secrets.SHALOM_PASSWORD }}
          # Sesion ya iniciada: evita el login y con el su reCAPTCHA.
          SHALOM_STORAGE_STATE: ${{ secrets.SHALOM_STORAGE_STATE }}
        run: |
          if [ -n "${{ inputs.reavisar }}" ]; then
            python revisar.py --reavisar "${{ inputs.reavisar }}"
          elif [ -n "${{ inputs.probar_ticket }}" ]; then
            python revisar.py --probar-ticket "${{ inputs.probar_ticket }}"
          else
            python revisar.py ${{ inputs.sin_avisos && '--sin-avisos' || '' }}
          fi

      # always(): si la revision falla, revisar.py deja anotado en state.json que
      # ya aviso del fallo. Sin esto ese paso se salta, la marca no se guarda y
      # el limite de "un aviso cada 6h" se reinicia en cada corrida fallida.
      - name: Guardar cambios de estado
        if: always()
        run: |
          git config user.name "shalom-bot"
          git config user.email "bot@users.noreflect.github.com"
          git add orders.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado de pedidos [skip ci]"
            git push
          else
            echo "Sin cambios que guardar."
          fi

      - name: Guardar capturas de depuracion (si hubo error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screens
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3
