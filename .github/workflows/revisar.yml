name: Revisar pedidos Shalom

on:
  schedule:
    # Cada 30 minutos. GitHub usa UTC. Corre solo, sin tu laptop.
    - cron: "*/30 * * * *"
  workflow_dispatch:      # permite ejecutarlo a mano desde la web de GitHub
    inputs:
      sin_avisos:
        description: "Solo sincronizar estados, sin avisar a nadie (util la primera vez)"
        type: boolean
        default: false
      probar_ticket:
        description: "N de pedido para probar el envio del ticket (deja vacio para una corrida normal)"
        type: string
        default: ""
      reavisar:
        description: "Reenviar el aviso de llegada de estos pedidos, separados por coma"
        type: string
        default: ""

permissions:
  contents: write          # para guardar orders.json / state.json

concurrency:
  group: revisar-shalom
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          # Chrome de marca: reCAPTCHA v3 puntua la huella del navegador y la
          # compilacion oficial es la que tienen los usuarios reales. Si Google
          # no sirve el paquete, shalompro.py se cae solo al Chromium de arriba.
          python -m playwright install chrome \
            || echo "Sin Chrome de marca; se usara Chromium."
          # Xvfb: una pantalla de mentira para poder abrir el navegador CON
          # ventana. El modo headless deja huellas propias que bajan la nota.
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Ejecutar revision
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHALOM_EMAIL: ${{ secrets.SHALOM_EMAIL }}
          SHALOM_PASSWORD: ${{ secrets.SHALOM_PASSWORD }}
          # Sesion ya iniciada: evita el login y con el su reCAPTCHA.
          SHALOM_STORAGE_STATE: ${{ secrets.SHALOM_STORAGE_STATE }}
          # Token de alcance fino (solo este repo, Secrets: write) para que
          # el bot renueve su propia sesion y no caduque nunca.
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Con ventana (sobre Xvfb) y con Chrome de marca: las dos cosas suben
          # la nota de reCAPTCHA v3, que es lo que decide si deja entrar.
          SHALOM_HEADLESS: "0"
          SHALOM_CHROME_CHANNEL: chrome
          # Las entradas del formulario van por entorno, no interpoladas en el
          # script: asi no pueden colarse como comandos.
          ENTRADA_REAVISAR: ${{ inputs.reavisar }}
          ENTRADA_TICKET: ${{ inputs.probar_ticket }}
          ENTRADA_SIN_AVISOS: ${{ inputs.sin_avisos }}
        run: |
          CORRER=(xvfb-run -a --server-args="-screen 0 1920x1080x24" python revisar.py)
          if [ -n "$ENTRADA_REAVISAR" ]; then
            "${CORRER[@]}" --reavisar "$ENTRADA_REAVISAR"
          elif [ -n "$ENTRADA_TICKET" ]; then
            "${CORRER[@]}" --probar-ticket "$ENTRADA_TICKET"
          elif [ "$ENTRADA_SIN_AVISOS" = "true" ]; then
            "${CORRER[@]}" --sin-avisos
          else
            "${CORRER[@]}"
          fi

      # always(): si la revision falla, revisar.py deja anotado en state.json que
      # ya aviso del fallo. Sin esto ese paso se salta, la marca no se guarda y
      # el limite de "un aviso cada 6h" se reinicia en cada corrida fallida.
      - name: Guardar cambios de estado
        if: always()
        run: |
          git config user.name "shalom-bot"
          git config user.email "bot@users.noreflect.github.com"
          git add orders.json state.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Actualizar estado de pedidos [skip ci]"
          # El remoto puede haber avanzado mientras esta corrida trabajaba (otra
          # corrida, o un commit nuestro). Sin rebasar, el push se rechaza y se
          # pierde el estado: entre otras cosas, el contador de fallos seguidos,
          # que es justo lo que dispara el aviso de mantenimiento.
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Estado guardado."
              exit 0
            fi
            echo "Push rechazado; reintento $intento..."
            sleep 5
          done
          echo "No se pudo guardar el estado tras 3 intentos."
          exit 1

      - name: Guardar capturas de depuracion (si hubo error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screens
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3
